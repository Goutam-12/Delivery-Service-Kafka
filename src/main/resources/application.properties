spring.application.name=Delivery-Service-Kafka

server.port=8082


# ==========================================
# DATABASE
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3306/09th-march-kafka

spring.datasource.username=root

spring.datasource.password=mysql

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true


# ==========================================
# KAFKA
# ==========================================

spring.kafka.bootstrap-servers=localhost:9092


# ==========================================
# PRODUCER
# ==========================================

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer


# ==========================================
# CONSUMER
# ==========================================

spring.kafka.consumer.group-id=delivery-service-group

spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.enable-auto-commit=false

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer


# ==========================================
# JSON
# ==========================================

spring.kafka.consumer.properties.spring.json.trusted.packages=com.amazon.delivery.event

spring.kafka.consumer.properties.spring.json.value.default.type=com.amazon.delivery.event.PaymentSuccessEvent

